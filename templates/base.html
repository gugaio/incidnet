<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Incidnet{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {theme: {extend: {colors: {
        ink: '#f7f9fc', panel: '#ffffff', line: '#dce5ef', accent: '#217db5'
      }}}}
    </script>
    <style>
      html { color-scheme: light; }
      body {
        background: radial-gradient(circle at 20% 5%, rgba(201, 211, 231, .72), transparent 29%),
          radial-gradient(circle at 84% 88%, rgba(96, 118, 160, .28), transparent 35%), #94a2bc;
      }
      body::before { content:""; position:fixed; inset:0; pointer-events:none; background:linear-gradient(120deg, rgba(255,255,255,.12), transparent 45%); }
      .prose p { margin:.55rem 0 } .prose ul { list-style:disc; padding-left:1.25rem }
      .prose code { color:#176b9f; background:#eef6fb; padding:.12rem .3rem; border-radius:.3rem }
      .prose h3 { font-weight:650; font-size:1.05rem; margin-bottom:.4rem }
      /* Compatibility palette for the existing screens while the product moves
         from the previous dark UI to the calm operational workspace. */
      .text-zinc-200 { color:#253247 !important }
      .text-zinc-300 { color:#344257 !important } .text-zinc-400 { color:#5d6b7e !important }
      .text-zinc-500 { color:#718096 !important } .text-zinc-600 { color:#91a0b2 !important }
      .bg-zinc-800 { background-color:#eef3f8 !important } .bg-zinc-900 { background-color:#e7edf4 !important }
      .border-zinc-700 { border-color:#cbd7e3 !important } .bg-violet-950\/20 { background-color:#f3effd !important }
      .bg-violet-950\/40, .bg-violet-950 { background-color:#f1edfc !important }
      .bg-emerald-950\/30, .bg-emerald-950\/40, .bg-emerald-950 { background-color:#ebf8f1 !important }
      .bg-rose-950\/40, .bg-rose-950 { background-color:#fff0f1 !important }
      .bg-sky-950 { background-color:#e9f7fc !important }
      .border-violet-900, .border-violet-900\/60 { border-color:#d9cdf6 !important }
      .border-emerald-900, .border-emerald-900\/60 { border-color:#bde8d3 !important }
      .border-rose-900, .border-rose-900\/60 { border-color:#f3c8ce !important }
      .border-amber-900 { border-color:#f4d7a2 !important }
      .text-violet-300, .text-violet-400 { color:#7651ad !important }
      .text-emerald-400 { color:#177a55 !important } .text-rose-400 { color:#c23b52 !important }
      .text-amber-400 { color:#aa6b08 !important } .text-sky-300 { color:#237da8 !important }
      input, textarea { color:#172033; }
      /* Titles sit on the light panel surface; `text-white` itself remains the
         standard Tailwind white for buttons, icons and dark surfaces. */
      .bg-panel h1.text-white, .bg-panel h2.text-white,
      .bg-panel h3.text-white, .bg-panel .font-semibold.text-white:not(button) { color:#172033; }
      .page-surface { position:relative; background:rgba(240,242,246,.94); }
      @media (min-width: 1024px) { .page-surface { min-height:calc(100vh - 156px); } }
    </style>
  </head>
  <body class="min-h-screen text-zinc-700 antialiased">
    <header class="mx-auto mt-5 max-w-[1440px] rounded-t-[32px] border border-white/70 border-b-0 bg-[#f0f2f6]/95 backdrop-blur z-20 shadow-[0_18px_52px_rgba(39,54,83,.16)]">
      <div class="h-[78px] px-6 sm:px-8 flex items-center justify-between">
        <a href="/" class="font-semibold tracking-tight flex items-center gap-2.5 text-xl text-slate-900">
          <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-sky-400 via-indigo-500 to-violet-500 text-white shadow-[0_5px_18px_rgba(86,105,225,.25)]">⌁</span>Incidnet
        </a>
        <div class="flex items-center gap-4 text-sm text-slate-500"><span class="hidden sm:inline">Central de operações</span><span class="h-9 w-9 rounded-full bg-white text-slate-700 flex items-center justify-center border border-slate-200 shadow-sm">N2</span></div>
      </div>
    </header>
    <main class="page-surface mx-auto mb-5 max-w-[1440px] rounded-b-[32px] border border-white/70 border-t-0 px-6 py-8 sm:px-8 shadow-[0_22px_55px_rgba(39,54,83,.16)]">{% block content %}{% endblock %}</main>
  </body>
</html>
